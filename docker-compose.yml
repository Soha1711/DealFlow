services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealflow360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5433 avoids colliding with other local Postgres instances on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealflow360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: